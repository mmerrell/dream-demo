version: '3.8'
services:
  backend:
    platform: linux/amd64
    image: mmerrell/dream-demo-backend:${SPRINT_VERSION}
    working_dir: /app/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dreamdemo
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      TEMPORAL_HOST: temporal:7233
      FRONTEND_URL: http://${INSTANCE_IP}:3000
    depends_on:
      - db
      - temporal
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - temporal-network
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: dreamdemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - temporal-network

  frontend:
    platform: linux/amd64
    image: mmerrell/dream-demo-frontend:${SPRINT_VERSION}
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://${INSTANCE_IP}:8000
      REACT_APP_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      REACT_APP_SPRINT_VERSION: ${SPRINT_VERSION}

  # Temporal Services
  temporal:
    image: temporalio/auto-setup:1.22.4
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    depends_on:
      - temporal-postgres
    networks:
      - temporal-network
    restart: unless-stopped

  temporal-postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    networks:
      - temporal-network

  temporal-ui:
    image: temporalio/ui:2.21.3
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://${INSTANCE_IP}:3000
    depends_on:
      - temporal
    networks:
      - temporal-network

  process-order-worker:
    platform: linux/amd64
    image: mmerrell/dream-demo-backend:${SPRINT_VERSION}
    command: python -B process_order_worker.py
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dreamdemo
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      TEMPORAL_HOST: temporal:7233
    depends_on:
      - db
      - temporal
    networks:
      - temporal-network
    restart: unless-stopped

  process-payment-worker:
    platform: linux/amd64
    image: mmerrell/dream-demo-backend:${SPRINT_VERSION}
    command: python -B process_payment_worker.py
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dreamdemo
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      TEMPORAL_HOST: temporal:7233
    depends_on:
      - db
      - temporal
    networks:
      - temporal-network
    restart: unless-stopped

volumes:
  postgres_data:
  temporal_postgres_data:

networks:
  temporal-network:
    driver: bridge