services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: dreamdemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend  # Build locally for your Mac
    depends_on:
      - db
    volumes:
      - ./backend/app:/app  # Live code mounting
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dreamdemo
      SECRET_KEY: your-secret-key-here
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend-web  # Build locally for your Mac
    depends_on:
      - backend
    volumes:
      - ./frontend-web:/app  # Live code mounting
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8000  # Local development
      REACT_APP_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      CHOKIDAR_USEPOLLING: true  # For hot reload
    ports:
      - "3000:3000"

volumes:
  postgres_data: