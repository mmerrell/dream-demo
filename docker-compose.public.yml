services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dreamdemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    platform: linux/amd64
    image: mmerrell/dream-demo-backend:sprint-2
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dreamdemo
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      FRONTEND_URL: http://${INSTANCE_IP}:3000
    ports:
      - "8000:8000"

  frontend:
    platform: linux/amd64
    image: mmerrell/dream-demo-frontend:${SPRINT_VERSION}
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://${INSTANCE_IP}:8000
      REACT_APP_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      REACT_APP_SPRINT_VERSION: ${SPRINT_VERSION}  # Add this line if missing!

volumes:
  postgres_data: