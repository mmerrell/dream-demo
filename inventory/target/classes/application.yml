spring:
  application:
    name: inventory-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/inventory_db}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8001
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.dreamdemo.inventory: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG